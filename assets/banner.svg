<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-labelledby="baTitle baDesc">
  <title id="baTitle">Story Architect, an Agent Skill for structured story writing</title>
  <desc id="baDesc">A blueprint panel on a drafting grid. On the left, the project name, the tagline, a story prompt being typed into a terminal line, and chips naming what a run produces: blueprint, character web, 22-step plot, scene weave, the story. On the right, a plotter reticle drafts the story arc of the seven key structure steps, numbered one to seven, rising to the battle node and settling on a drawn datum line at a new equilibrium. A footer notes the project is an independent implementation not affiliated with John Truby.</desc>

  <defs>
    <clipPath id="baFrame"><rect width="1200" height="380" rx="14"/></clipPath>
    <pattern id="baGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#152340" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }

    .rise { animation: rise 0.7s ease-out both; }
    .d1 { animation-delay: 0.2s; } .d2 { animation-delay: 0.35s; } .d3 { animation-delay: 0.3s; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .typeMask { width: 382px; animation: typeW 1.95s steps(39, end) 0.6s both; }
    @keyframes typeW { from { width: 0px; } }
    .caret { transform: translateX(376px); animation: caretMove 1.95s steps(39, end) 0.6s both, blink 1.1s step-end 2.75s infinite; }
    @keyframes caretMove { from { transform: translateX(0px); } }
    @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }

    .arc { stroke-dasharray: 1; stroke-dashoffset: 0; animation: draw 2.6s linear 2.6s both; }
    @keyframes draw { from { stroke-dashoffset: 1; } }

    .node { transform-box: fill-box; transform-origin: center; animation: pop 0.35s ease-out both; }
    @keyframes pop { from { opacity: 0; transform: scale(0.4); } to { opacity: 1; transform: scale(1); } }
    .fade { animation: fadeIn 0.5s ease-out both; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .n1 { animation-delay: 2.6s; } .n2 { animation-delay: 3.03s; } .n3 { animation-delay: 3.44s; }
    .n4 { animation-delay: 3.85s; } .n5 { animation-delay: 4.45s; } .n6 { animation-delay: 4.8s; }
    .n7 { animation-delay: 5.15s; }
    .l0 { animation-delay: 2.5s; } .l1 { animation-delay: 2.75s; } .l5 { animation-delay: 4.55s; }
    .l7 { animation-delay: 5.25s; } .datum { animation-delay: 4.95s; }

    .chip { animation: rise 0.5s ease-out both; }
    .c0 { animation-delay: 2.8s; } .c1 { animation-delay: 2.9s; } .c2 { animation-delay: 3.35s; }
    .c3 { animation-delay: 3.8s; } .c4 { animation-delay: 4.25s; } .c5 { animation-delay: 5.3s; }

    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; animation-delay: 0s !important; }
      .typeMask { width: 382px !important; }
      .arc { stroke-dashoffset: 0 !important; }
      .caret { opacity: 1 !important; transform: translateX(376px) !important; }
    }
  </style>

  <g clip-path="url(#baFrame)">
    <rect width="1200" height="380" fill="#0B1220"/>
    <rect width="1200" height="380" fill="url(#baGrid)" opacity="0.55"/>
    <rect x="20" y="20" width="1160" height="340" rx="6" fill="none" stroke="#1B2C4C" stroke-width="1" stroke-dasharray="5 7"/>

    <!-- name and tagline, quoted from the README -->
    <text class="sans rise" x="56" y="92" font-size="48" font-weight="600" fill="#EAF0FA">Story Architect</text>
    <g class="sans rise d1" fill="#9DB0CE" font-size="17">
      <text x="58" y="130">AI story writing with a structure underneath it:</text>
      <text x="58" y="155">an Agent Skill that runs the ten phases of John Truby's</text>
      <text x="58" y="180"><tspan font-style="italic">The Anatomy of Story</tspan> on your prompt, blueprint first,</text>
      <text x="58" y="205">then the finished prose</text>
    </g>

    <!-- the trigger command, typed -->
    <g class="rise d2">
      <rect x="56" y="224" width="470" height="44" rx="8" fill="#0F1B31" stroke="#25395E"/>
      <text class="mono" x="72" y="252" font-size="16" fill="#58A6FF">&#8250;</text>
      <clipPath id="baType"><rect class="typeMask" x="92" y="231" width="382" height="26"/></clipPath>
      <g clip-path="url(#baType)">
        <text class="mono" x="92" y="252" font-size="16" fill="#D7E2F4">Write a story about a lighthouse keeper</text>
      </g>
      <rect class="caret" x="92" y="236" width="8" height="20" fill="#58A6FF"/>
    </g>

    <!-- what a run produces, as chips -->
    <text class="mono chip c0" x="58" y="288" font-size="12.5" fill="#5E7096">what a run produces</text>
    <g class="mono" font-size="14" fill="#9DB0CE">
      <g class="chip c1"><rect x="54" y="294" width="96" height="30" rx="15" fill="#111E36" stroke="#25395E"/><text x="102" y="313" text-anchor="middle">blueprint</text></g>
      <g class="chip c2"><rect x="158" y="294" width="130" height="30" rx="15" fill="#111E36" stroke="#25395E"/><text x="223" y="313" text-anchor="middle">character web</text></g>
      <g class="chip c3"><rect x="296" y="294" width="121" height="30" rx="15" fill="#111E36" stroke="#25395E"/><text x="356" y="313" text-anchor="middle">22-step plot</text></g>
      <g class="chip c4"><rect x="425" y="294" width="113" height="30" rx="15" fill="#111E36" stroke="#25395E"/><text x="481" y="313" text-anchor="middle">scene weave</text></g>
      <g class="chip c5"><rect x="546" y="294" width="96" height="30" rx="15" fill="#111E36" stroke="#25395E"/><text x="594" y="313" text-anchor="middle">the story</text></g>
    </g>

    <!-- the story arc, drafting itself -->
    <text class="mono fade l0" x="660" y="82" font-size="13" fill="#5E7096">the seven key structure steps</text>
    <line x1="660" y1="272" x2="1168" y2="272" stroke="#1B2C4C" stroke-width="1"/>
    <line class="fade datum" x1="1090" y1="206" x2="1168" y2="206" stroke="#58A6FF" stroke-width="1" stroke-dasharray="4 6" opacity="0.4"/>

    <g stroke="#1B2C4C" stroke-width="1" stroke-dasharray="3 5">
      <line class="fade n1" x1="692" y1="256" x2="692" y2="270"/>
      <line class="fade n2" x1="768" y1="240" x2="768" y2="270"/>
      <line class="fade n3" x1="840" y1="226" x2="840" y2="270"/>
      <line class="fade n4" x1="912" y1="212" x2="912" y2="270"/>
      <line class="fade n5" x1="1010" y1="127" x2="1010" y2="270"/>
    </g>

    <path class="arc" pathLength="1" d="M692 248C724 240 740 237 768 232C798 226 812 224 840 218C868 212 884 211 912 204C946 195 978 172 1010 118C1030 148 1052 166 1078 180C1104 194 1124 202 1150 206"
          fill="none" stroke="#58A6FF" stroke-width="2.5" stroke-linecap="round"/>

    <g fill="#0B1220" stroke="#58A6FF" stroke-width="2.5">
      <circle class="node n1" cx="692" cy="248" r="6"/>
      <circle class="node n2" cx="768" cy="232" r="6"/>
      <circle class="node n3" cx="840" cy="218" r="6"/>
      <circle class="node n4" cx="912" cy="204" r="6"/>
      <circle class="node n5" cx="1010" cy="118" r="7" fill="#F2B98B" stroke="#F2B98B"/>
      <circle class="node n6" cx="1078" cy="180" r="6"/>
      <circle class="node n7" cx="1150" cy="206" r="6"/>
    </g>

    <g class="mono" font-size="12.5" fill="#5E7096">
      <text class="fade n2" x="752" y="219">2</text>
      <text class="fade n3" x="824" y="205">3</text>
      <text class="fade n4" x="896" y="191">4</text>
      <text class="fade n6" x="1056" y="198">6</text>
    </g>
    <g class="mono" font-size="16">
      <text class="fade l1" x="668" y="296" fill="#9DB0CE">1 &#183; weakness/need</text>
      <text class="fade l5" x="1010" y="96" fill="#F2B98B" text-anchor="middle">5 &#183; battle</text>
      <text class="fade l7" x="1166" y="234" fill="#9DB0CE" text-anchor="end">7 &#183; new equilibrium</text>
    </g>

    <!-- the plotter reticle that draws the arc, then parks -->
    <g transform="translate(692 248)">
      <g class="fade" style="animation-delay: 2.45s" opacity="0.9">
        <circle r="8" fill="none" stroke="#EAF0FA" stroke-width="1.5"/>
        <path d="M0 -13V-5M0 5V13M-13 0H-5M5 0H13" stroke="#EAF0FA" stroke-width="1.5" stroke-linecap="round"/>
        <circle r="1.6" fill="#58A6FF"/>
        <animateMotion dur="2.6s" begin="2.6s" fill="freeze" path="M0 0C32 -8 48 -11 76 -16C106 -22 120 -24 148 -30C176 -36 192 -37 220 -44C254 -53 286 -76 318 -130C338 -100 360 -82 386 -68C412 -54 432 -46 458 -42"/>
      </g>
    </g>

    <text class="sans rise d3" x="56" y="358" font-size="13.5" fill="#5E7096">Independent implementation. Not affiliated with, endorsed by, or sponsored by John Truby.</text>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="379" rx="14" fill="none" stroke="#25395E" stroke-width="1"/>
</svg>
